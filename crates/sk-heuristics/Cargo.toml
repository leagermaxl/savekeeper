[package]
name = "sk-heuristics"
description = "Heuristics for unknown folders, git repositories, user files and junk (SPEC-07)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# `PostCollector::collect` is async (SPEC-01 §4.3).
async-trait.workspace = true
# Built-in `data/extensions.yaml` (SPEC-07 §4.3.2, T-07-02).
serde.workspace = true
serde-saphyr.workspace = true
sk-core.workspace = true
# Errors of the built-in data (`DataError`).
thiserror.workspace = true
# "Recent" SQLite files of the marker classification (SPEC-07 §4.7, rule 8).
time.workspace = true
# `rt`: the heuristics run synchronously in `spawn_blocking` (SPEC-07 §4.1).
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# `MemFs` as the scanner of the collector tests.
sk-scan.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
