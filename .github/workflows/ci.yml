# CI for every PR and push to main (SPEC-12 §4.8).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo xtask check-deps
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      # Advisories only warn in PRs; nightly fails on them (SPEC-12 §4.8).
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exclude: ""
          # The Tauri app is built and tested on Windows only.
          - os: ubuntu-latest
            exclude: --exclude savekeeper-app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace ${{ matrix.exclude }} --all-targets --locked -- -D warnings
      - uses: actions/cache@v4
        with:
          path: target/fixtures-cache
          key: fixtures-${{ runner.os }}-${{ hashFiles('fixtures/**', 'crates/sk-testkit/src/**') }}
      # Validates the profiles and fills target/fixtures-cache for FakeProfile::load.
      # rust-cache can restore target/fixtures and target/fixtures-cache as skeletons of
      # empty folders (files stripped, markers included): xtask treats a file-less
      # --out as empty, and the cache ignores entries without their `.complete` marker.
      # The materialized copies go to the runner temp folder, which no cache restores;
      # nothing in CI reads them, the step only validates profiles and fills the cache.
      - run: cargo xtask fixtures --out "${{ runner.temp }}/fixtures"
      - run: cargo test --workspace ${{ matrix.exclude }} --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      # `+1.93` overrides the `stable` channel from rust-toolchain.toml.
      - run: cargo +1.93 check --workspace --exclude savekeeper-app --locked
