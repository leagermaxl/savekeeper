[package]
name = "sk-heuristics"
description = "Heuristics for unknown folders, git repositories, user files and junk (SPEC-07)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# `PostCollector::collect` is async (SPEC-01 §4.3).
async-trait.workspace = true
# H-GIT (SPEC-07 §4.4.2): read-only repository state. `status` brings the index,
# the directory walk and ignore rules; no network, no credentials, no writes.
gix = { workspace = true, features = ["sha1", "status"] }
# Built-in `data/extensions.yaml` (SPEC-07 §4.3.2, T-07-02).
serde.workspace = true
serde-saphyr.workspace = true
# `params` of the `git-bundle` child finding (SPEC-07 §4.4.4, T-07-10).
serde_json.workspace = true
sk-core.workspace = true
# `summarize` and the global exclusions of H-UNK (SPEC-07 §4.2.4, SPEC-03 §4.4).
sk-scan.workspace = true
# Errors of the built-in data (`DataError`).
thiserror.workspace = true
# "Recent" SQLite files of the marker classification (SPEC-07 §4.7, rule 8).
time.workspace = true
# `rt`: the heuristics run synchronously in `spawn_blocking` (SPEC-07 §4.1).
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# Manual benchmark of H-USR (SPEC-07 §6, NFR-07-02).
criterion.workspace = true
# `mem_fixture`: `fixtures/fs/heuristics/*` trees in `MemFs` (SPEC-07 §6).
sk-testkit.workspace = true
# Git test repositories in `<workspace>/target/tmp` (SPEC-07 §6).
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

# Manual benchmark (SPEC-07 §6, NFR-07-02): `cargo bench -p sk-heuristics --bench usr`.
[[bench]]
name = "usr"
harness = false

[lints]
workspace = true
