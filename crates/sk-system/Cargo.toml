[package]
name = "sk-system"
description = "System exports: winget, registry, Wi-Fi, drivers and more (SPEC-06)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# `SystemExporter::run` is async (SPEC-06 §4.1).
async-trait.workspace = true
# Hashes of exported files, `ExportedFile.blake3` (SPEC-06 §4.1, FR-06-02).
blake3.workspace = true
# OEM code page decoding of console tool output (SPEC-06 §4.6).
encoding_rs.workspace = true
# Exporter parameters `params` (SPEC-06 §4.3).
serde_json.workspace = true
sk-core.workspace = true
thiserror.workspace = true
# `Cmd`: child processes with timeout and cancellation (SPEC-06 §4.6);
# `rt`: `SystemCollector` runs `detect` in blocking tasks (SPEC-06 T-06-04).
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }
# `Cmd` logs the command, exit code and time (SPEC-06 §4.6).
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# WMI: `Win32_Printer`, `Win32_EncryptableVolume`, `SoftwareLicensingProduct` (SPEC-06 §4.3, T-06-09).
wmi.workspace = true

[dev-dependencies]
# Target folders of exporter tests, created under `target/tmp` (not the system temp dir).
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
