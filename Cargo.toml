[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
authors = ["Max Lyubchenko"]
publish = false

[workspace.dependencies]
# Internal crates (allowed edges: SPEC-01 §4.2)
sk-core = { path = "crates/sk-core" }
sk-scan = { path = "crates/sk-scan" }
sk-rules = { path = "crates/sk-rules" }
sk-games = { path = "crates/sk-games" }
sk-system = { path = "crates/sk-system" }
sk-heuristics = { path = "crates/sk-heuristics" }
sk-llm = { path = "crates/sk-llm" }
sk-score = { path = "crates/sk-score" }
sk-backup = { path = "crates/sk-backup" }
sk-restore = { path = "crates/sk-restore" }
sk-engine = { path = "crates/sk-engine" }
sk-testkit = { path = "crates/sk-testkit" }

# External crates used in P0 (SPEC-01 §4.2, SPEC-12 §4.2).
# Feature-crate dependencies are added together with their specs.
# Versions must stay compatible with rust-version (see .cargo/config.toml).
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
include_dir = "0.7"
# Steam VDF/ACF files (SPEC-05 §4.4).
keyvalues-parser = "0.2"
# Features are chosen per crate (sk-testkit: fixture repos; sk-heuristics: SPEC-07).
gix = { version = "0.88", default-features = false }
indicatif = "0.18"
rayon = "1"
# Ludusavi index cache `cache/ludusavi-index.bin` (SPEC-05 NFR-05-01).
postcard = { version = "1", default-features = false, features = ["use-std"] }
# Manifest download (SPEC-05 FR-05-01): rustls with the `ring` provider, no OpenSSL (SPEC-12 §4.6).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Linear-time regexes for rule conditions (SPEC-04 NFR-04-02).
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1"
# Pinned: pre-release, must match tauri-specta (SPEC-11 T-11-02).
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "time", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
uuid = "1"
# Embedded Ludusavi snapshot, compressed by sk-games/build.rs (SPEC-05 FR-05-02).
zstd = "0.14"
windows = "0.62"
winreg = "0.56"

# Test-only
assert_cmd = "2"
# Manual benchmarks only (`cargo bench`, SPEC-12 §2.2); no plots, no rayon of its own.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1", features = ["json"] }
predicates = "3"
tempfile = "3"
# Mock HTTP server for ManifestStore tests (SPEC-05 §6).
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny" # allowed only in sk-core::win and sk-scan::win (SPEC-00 §7.1)
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

# sk-games/build.rs compresses the ~17 MB Ludusavi snapshot at zstd level 19, and tests
# decompress it: build the zstd C library optimized in dev and test builds too.
[profile.dev.package.zstd-sys]
opt-level = 3
