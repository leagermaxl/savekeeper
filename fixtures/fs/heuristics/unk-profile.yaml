  # === {PROGRAMDATA} ===
  - path: "{PROGRAMDATA}/Recent/config.json"
    size: 2 KiB
    mtime: "-10d"
  - path: "{PROGRAMDATA}/Stale/config.json"
    size: 2 KiB
    mtime: "-400d"
  - path: "{PROGRAMDATA}/Agent/agent.exe"
    size: 4 MiB
    mtime: "-1d"

  # === {DOCUMENTS} ===
  - path: "{DOCUMENTS}/Klei/DoNotStarveTogether/client.ini"
    size: 2 KiB
    mtime: "-6d"
  - path: "{DOCUMENTS}/Rockstar Games/GTA V/Profiles/ABCD/SGTA50000"
