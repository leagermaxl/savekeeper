[package]
name = "sk-backup"
description = "Backup writer: archive, manifest, report, encryption and verification (SPEC-10)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# JSON Schema of `manifest.json`, the contract for SPEC-13 (SPEC-10 §4.4).
schemars.workspace = true
# Backup passphrase (SPEC-10 §4.7): redacted `Debug`, zeroed on drop.
secrecy.workspace = true
serde.workspace = true
# `params` of system exports in the manifest (SPEC-10 §4.4).
serde_json.workspace = true
sk-core.workspace = true
specta.workspace = true
# Timestamps of the manifest (RFC 3339).
time.workspace = true
# `backup_id`, `scan_id`.
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Snapshots of the manifest example and its JSON Schema (SPEC-10 T-10-01, SPEC-12 FR-12-04).
insta.workspace = true
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
