  - path: "{LOCALAPPDATA}/Microsoft/PowerToys/FancyZones/Logs/log.txt"
    size: 16 KiB
  - path: "{LOCALAPPDATA}/Microsoft/PowerToys/FancyZones/Logs/0.85.0/state.json"
    size: 4 KiB
  - path: "{LOCALAPPDATA}/Microsoft/PowerToys/Updates/PowerToysUserSetup-0.86.0-x64.exe"
    size: 300 MiB
  - path: "{LOCALAPPDATA}/Microsoft/PowerToys/Updates/release.json"
    size: 2 KiB
