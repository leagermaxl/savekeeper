[package]
name = "sk-llm"
description = "LLM classifier abstraction, providers, prompt, privacy and cache (SPEC-08)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `MockClassifier` for tests of other crates (SPEC-08 §4.2.4):
# `sk-llm = { workspace = true, features = ["mock"] }` in `[dev-dependencies]`.
mock = ["dep:tokio"]

[dependencies]
# `Classifier` is an async trait object (SPEC-08 §4.1).
async-trait.workspace = true
# Validating suggested globs (SPEC-08 §4.6).
globset.workspace = true
serde.workspace = true
# Parsing the model response (SPEC-08 §4.6).
serde_json.workspace = true
sk-core.workspace = true
# `LlmError` (SPEC-08 §4.1).
thiserror.workspace = true
# `MockClassifier`: simulated delay racing the cancellation token.
tokio = { workspace = true, features = ["macros", "time"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
