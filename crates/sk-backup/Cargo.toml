[package]
name = "sk-backup"
description = "Backup writer: archive, manifest, report, encryption and verification (SPEC-10)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# JSON Schema of `manifest.json`, the contract for SPEC-13 (SPEC-10 §4.4).
schemars.workspace = true
# Backup passphrase (SPEC-10 §4.7): redacted `Debug`, zeroed on drop.
secrecy.workspace = true
serde.workspace = true
# `params` of system exports in the manifest (SPEC-10 §4.4).
serde_json.workspace = true
sk-core.workspace = true
specta.workspace = true
thiserror.workspace = true
# Timestamps of the manifest (RFC 3339); `local-offset`: local DOS times of zip entries.
time = { workspace = true, features = ["local-offset"] }
# `backup_id`, `scan_id`.
uuid = { workspace = true, features = ["serde"] }
# `zip` backups (SPEC-10 §4.3): deflate (pure Rust zlib-rs) or stored, zip64.
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# Snapshots of the manifest example and its JSON Schema (SPEC-10 T-10-01, SPEC-12 FR-12-04).
insta.workspace = true
# Temporary target folders of the `estimate` tests, under `target/tmp` (SPEC-10 T-10-03).
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }

[lints]
workspace = true
