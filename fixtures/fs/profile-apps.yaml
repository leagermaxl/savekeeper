  # === windows-shell.yaml ===
  - path: "{APPDATA}/Microsoft/Internet Explorer/Quick Launch/User Pinned/TaskBar/File Explorer.lnk"
    size: 1 KiB
  - path: "{APPDATA}/Microsoft/Windows/SendTo/Desktop (create shortcut).DeskLink"
    size: 0
  - path: "{APPDATA}/Microsoft/Windows/Recent/AutomaticDestinations/f01b4d95cf55d32a.automaticDestinations-ms"
    size: 24 KiB
    mtime: "-1d"
  # --- Sticky Notes: the database in WAL mode next to unrelated state ---
  - path: "{LOCALAPPDATA}/Packages/Microsoft.MicrosoftStickyNotes_8wekyb3d8bbwe/LocalState/plum.sqlite"
    size: 96 KiB
    mtime: "-2d"
  - path: "{LOCALAPPDATA}/Packages/Microsoft.MicrosoftStickyNotes_8wekyb3d8bbwe/LocalState/plum.sqlite-wal"
    size: 32 KiB
    mtime: "-1d"
  - path: "{LOCALAPPDATA}/Packages/Microsoft.MicrosoftStickyNotes_8wekyb3d8bbwe/LocalState/plum.sqlite-shm"
    size: 32 KiB
    mtime: "-1d"
  - path: "{LOCALAPPDATA}/Packages/Microsoft.MicrosoftStickyNotes_8wekyb3d8bbwe/LocalState/Telemetry/events.dat"
    size: 8 KiB
  - path: "{PICTURES}/Screenshots/Screenshot 2026-09-30 120000.png"
    size: 400 KiB
    repeat: 2
  # --- PowerToys: module JSON next to logs and downloaded updates ---
  - path: "{LOCALAPPDATA}/Microsoft/PowerToys/settings.json"
    size: 2 KiB
  - path: "{LOCALAPPDATA}/Microsoft/PowerToys/FancyZones/settings.json"
    size: 3 KiB
  - path: "{LOCALAPPDATA}/Microsoft/PowerToys/FancyZones/custom-layouts.json"
