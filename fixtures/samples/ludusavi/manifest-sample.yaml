# Hand-written sample in the format of
# https://github.com/mtkennerly/ludusavi-manifest (data/manifest.yaml):
# block style, games sorted by name, strings quoted only where YAML needs it.
# Paths and ids are illustrative, not copied from the real manifest.
# Covers every field and variant of the SPEC-05 §4.2 model plus fields the
# model ignores (launch, notes, id.lutris, unknown keys). Used by
