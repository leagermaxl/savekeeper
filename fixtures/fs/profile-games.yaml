# Games, emulators and cloud clients for the built-in rules of SPEC-04
# §4.7.8–§4.7.9. Each program has the data worth saving next to the caches,
# logs, BIOS images and downloads the rules exclude or claim. Steam has two
# accounts (`{STEAM_USERID}`); only the first one took screenshots. Absent on
# purpose: yuzu (only Ryujinx), Dolphin's legacy Documents folder,
# DuckStation's Local folder, Google Backup and Sync, Yandex.Disk. Not here,
# added by the tests: drive-root folders (`{DRIVE:*}`: portable RetroArch and
# RPCS3), installed programs and the iCloud Store package.
# Loaded into MemFs by sk_testkit::mem_fixture.
launchers:
  steam: { root: "Program Files (x86)/Steam", users: ["12345678", "87654321"] }
tree:
  # === games-extra.yaml ===
  # --- Steam: per-account config and screenshots ---
  - path: "{STEAM}/userdata/12345678/config/localconfig.vdf"
    size: 48 KiB
    mtime: "-1d"
  - path: "{STEAM}/userdata/12345678/config/shortcuts.vdf"
    size: 2 KiB
  - path: "{STEAM}/userdata/12345678/config/grid/570_p.png"
    size: 200 KiB
  - path: "{STEAM}/userdata/12345678/760/remote/570/screenshots/20260901201500_1.jpg"
    size: 400 KiB
    repeat: 2
  - path: "{STEAM}/userdata/12345678/760/remote/570/screenshots/thumbnails/20260901201500_1.jpg"
    size: 20 KiB
    repeat: 2
  - path: "{STEAM}/userdata/12345678/760/screenshots.vdf"
    size: 1 KiB
  - path: "{STEAM}/userdata/87654321/config/localconfig.vdf"
    size: 16 KiB
  - path: "{STEAM}/steamapps/common/Dota 2 beta/game/bin/win64/dota2.exe"
    size: 1 MiB
  # --- Minecraft: Java Edition ---
