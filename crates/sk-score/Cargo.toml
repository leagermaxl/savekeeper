[package]
name = "sk-score"
description = "Finding merging, importance scoring and default selection (SPEC-09)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `ScoringConfig`, `Finding`, `ScanIssue` and the other SPEC-02 types.
sk-core.workspace = true
# Include/exclude glob checks of `merge_nested` (§4.4), matched like `sk-scan`.
globset.workspace = true
# `OffsetDateTime` of `score()` (§4.1): `now` comes from the caller.
time.workspace = true

[dev-dependencies]
# Manual benchmark of `run()` (SPEC-09 §6.4, NFR-09-01).
criterion.workspace = true
# Properties of `run()` (SPEC-09 §6.3).
proptest.workspace = true
time = { workspace = true, features = ["macros"] }

# Manual benchmark (SPEC-09 §6.4, NFR-09-01): `cargo bench -p sk-score --bench score`.
[[bench]]
name = "score"
harness = false
