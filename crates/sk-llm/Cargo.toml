[package]
name = "sk-llm"
description = "LLM classifier abstraction, providers, prompt, privacy and cache (SPEC-08)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `MockClassifier` for tests of other crates (SPEC-08 §4.2.4):
# `sk-llm = { workspace = true, features = ["mock"] }` in `[dev-dependencies]`.
mock = ["dep:tokio"]

[dependencies]
# `Classifier` is an async trait object (SPEC-08 §4.1).
async-trait.workspace = true
# Validating suggested globs (SPEC-08 §4.6).
globset.workspace = true
# Cache keys of `llm-cache.jsonl` (SPEC-08 §4.7).
blake3.workspace = true
# API keys (SPEC-08 §4.10): redacted `Debug`, exposed only when a request is built.
secrecy.workspace = true
serde.workspace = true
# HTTP of the providers (SPEC-08 §4.2): rustls with the `ring` provider, no OpenSSL.
reqwest.workspace = true
rustls.workspace = true
# Parsing the model response (SPEC-08 §4.6).
serde_json.workspace = true
sk-core.workspace = true
# `LlmError` (SPEC-08 §4.1).
thiserror.workspace = true
# Truncating summary timestamps to the day (SPEC-08 §4.3, §4.7).
time.workspace = true
# Warnings about broken cache lines (SPEC-08 §4.7).
tracing.workspace = true
# `MockClassifier`: simulated delay racing the cancellation token.
tokio = { workspace = true, features = ["macros", "time"], optional = true }

[target.'cfg(windows)'.dependencies]
# `CredentialManagerStore` (SPEC-08 §4.10): Windows Credential Manager only.
keyring = { workspace = true, features = ["windows-native"] }

[dev-dependencies]
# Snapshot of provider request bodies (SPEC-08 §6.1).
insta.workspace = true
# Cache files in temporary folders under `target/tmp` (SPEC-08 §6.1).
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
# Local mock HTTP server emulating the providers (SPEC-08 §6.2); no real network.
wiremock.workspace = true

[lints]
workspace = true
