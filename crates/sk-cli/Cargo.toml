[package]
name = "sk-cli"
description = "SaveKeeper command-line interface for development and debugging (SPEC-01 §4.9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "savekeeper-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
serde_json.workspace = true
sk-core.workspace = true
sk-engine.workspace = true
sk-scan.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
assert_cmd.workspace = true
async-trait.workspace = true
predicates.workspace = true
sk-rules.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
