[package]
name = "sk-games"
description = "Game save discovery: Ludusavi manifest and launchers (SPEC-05)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# `Collector` of `GamesCollector` (SPEC-01 §4.3).
async-trait.workspace = true
# Include globs of manifest entries are checked against the files (SPEC-05 §4.6 step 4).
globset.workspace = true
keyvalues-parser.workspace = true
postcard.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
# Epic `.item` and EA `InstallData` JSON files (SPEC-05 §4.4).
serde_json.workspace = true
sk-core.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing.workspace = true
zstd.workspace = true

# build.rs compresses third_party/ludusavi/manifest.yaml into the embedded snapshot (FR-05-02).
[build-dependencies]
zstd.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
sk-scan.workspace = true
sk-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
wiremock.workspace = true

# Manual benchmark (SPEC-05 §6, NFR-05-01): `cargo bench -p sk-games --bench manifest`.
[[bench]]
name = "manifest"
harness = false

[lints]
workspace = true
