[package]
name = "sk-engine"
description = "Scan pipeline and backup job orchestration (SPEC-01 §4.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["embedded-manifest"]
# The Ludusavi manifest snapshot in the binary (SPEC-05 FR-05-11).
embedded-manifest = ["sk-games/embedded-manifest"]

[dependencies]
serde_json.workspace = true
sk-core.workspace = true
sk-games.workspace = true
sk-rules.workspace = true
sk-scan.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
async-trait.workspace = true
sk-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
