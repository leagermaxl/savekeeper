[package]
name = "sk-scan"
description = "File system traversal, measurement, folder summaries and exclusions (SPEC-03)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
globset.workspace = true
rayon.workspace = true
sk-core.workspace = true
time.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion.workspace = true
sk-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["sync"] }

# Manual benchmark (SPEC-03 §6, NFR-03-01): `cargo bench -p sk-scan --bench walk`.
[[bench]]
name = "walk"
harness = false

[lints]
workspace = true
